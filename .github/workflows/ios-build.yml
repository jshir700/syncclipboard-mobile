name: ios-build

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: "App version from package.json"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build Config Plugins
        run: cd plugins && npx tsc

      - name: Install CocoaPods
        run: sudo gem install cocoapods -N

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install

      - name: Patch Podfile for Swift 6 concurrency
        shell: bash
        run: |
          echo 'post_install do |installer|
            installer.pods_project.build_configurations.each do |config|
              config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"
              config.build_settings["SWIFT_VERSION"] = "5.0"
            end
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"
                config.build_settings["SWIFT_VERSION"] = "5.0"
              end
            end
          end' >> ios/Podfile
          echo "=== Last 15 lines of Podfile ==="
          tail -15 ios/Podfile

      - name: Install pods
        run: cd ios && pod install

      - name: Build Release .app (unsigned)
        run: |
          cd ios
          xcodebuild \
            -workspace SyncClipboard.xcworkspace \
            -scheme SyncClipboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            -quiet

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          echo "App found at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r SyncClipboard.ipa Payload/
          rm -rf Payload

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename IPA
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mv SyncClipboard.ipa "SyncClipboard-${VERSION}-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ipa-unsigned
          path: SyncClipboard-${{ steps.version.outputs.version }}-unsigned.ipa
